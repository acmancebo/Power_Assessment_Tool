<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Link to PapaParse library for CSV parsing -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectWise Assessment Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- General & Layout --- */
        :root {
            --bg-color: #f4f7fa;
            --card-bg-color: #ffffff;
            --text-color: #333;
            --text-secondary-color: #6c757d;
            --border-color: #e9ecef;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            --color-ready: #28a745;
            --color-critical: #dc3545;
            --color-high: #fd7e14;
            --color-medium: #ffc107;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* --- KPI Cards --- */
        .kpi-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            flex: 1 1 200px; /* Flex-grow, flex-shrink, flex-basis */
            background-color: var(--card-bg-color);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-title {
            font-size: 0.9rem;
            color: var(--text-secondary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .kpi-classification {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Color Indicators */
        .classification-ready {
            color: var(--color-ready);
        }
        .classification-critical {
            color: var(--color-critical);
        }
        .classification-high-risk {
            color: var(--color-high);
        }
        .classification-moderate-risk {
            color: var(--color-medium);
        }

        /* --- Charts --- */
        .chart-container {
            background-color: var(--card-bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            max-width: 450px; /* Constrain chart size */
            margin: 0 auto; /* Center the chart container */
        }

        /* --- Responsiveness --- */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .kpi-card {
                flex-basis: calc(50% - 10px); /* Two cards per row on tablets */
            }
            header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .kpi-card {
                flex-basis: 100%; /* One card per row on mobile */
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>ProjectWise Assessment Dashboard</h1>
        </header>

        <!-- KPI Cards Section -->
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-title">Total Folders Compared</div>
                <div id="kpi-total-folders" class="kpi-value">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Folders with Issues</div>
                <div id="kpi-total-issues" class="kpi-value">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Readiness Score</div>
                <div id="kpi-score-value" class="kpi-value">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Classification</div>
                <div id="kpi-score-classification" class="kpi-classification">N/A</div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-container">
            <canvas id="severityChart"></canvas>
        </div>
    </div>
    
    <!-- Add PapaParse for robust CSV handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Link to the actual dashboard logic script -->
    <script src="dashboard.js"></script>

</body>
</html>
